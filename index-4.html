<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bridge Studio</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #0f0f13;
      --surface: #1a1a22;
      --surface2: #22222e;
      --border: #2e2e3e;
      --text: #e8e8f0;
      --text-dim: #8888a0;
      --claude: #a78bfa;
      --gpt: #34d399;
      --user: #60a5fa;
      --accent: #7c3aed;
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    /* AUTH SCREEN */
    #auth-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      gap: 24px;
    }

    .logo {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .logo span { color: var(--claude); }

    .auth-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px 24px;
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .auth-card h2 { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
    .auth-card p { font-size: 13px; color: var(--text-dim); }

    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    input {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 15px;
      padding: 12px 14px;
      width: 100%;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus { border-color: var(--accent); }

    .eye-btn {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      font-size: 18px;
      padding: 4px;
      width: auto;
      line-height: 1;
    }

    .eye-btn:hover { color: var(--text); }

    input[type="password"] { padding-right: 44px; }

    button {
      background: var(--accent);
      border: none;
      border-radius: 8px;
      color: white;
      cursor: pointer;
      font-size: 15px;
      font-weight: 600;
      padding: 13px;
      width: 100%;
      transition: opacity 0.2s;
    }

    button:hover { opacity: 0.85; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .auth-toggle {
      background: none;
      color: var(--claude);
      font-size: 13px;
      font-weight: 500;
      padding: 0;
      text-align: center;
      width: auto;
    }

    .error-msg { color: #f87171; font-size: 13px; text-align: center; }
    .info-msg { color: var(--gpt); font-size: 13px; text-align: center; }

    /* KEYS SCREEN */
    #keys-screen {
      display: none;
      flex: 1;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      gap: 16px;
    }

    .keys-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px 24px;
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .keys-card h2 { font-size: 18px; font-weight: 600; }
    .keys-card p { font-size: 13px; color: var(--text-dim); line-height: 1.5; }
    .keys-card label { font-size: 13px; font-weight: 600; color: var(--text-dim); display: block; margin-bottom: 6px; }

    /* CHAT SCREEN */
    #chat-screen {
      display: none;
      flex-direction: column;
      height: 100dvh;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .project-name { font-size: 16px; font-weight: 700; }

    .ai-badges { display: flex; gap: 6px; margin-top: 4px; }

    .badge {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 100px;
    }

    .badge.claude { background: #3b1f7a; color: var(--claude); }
    .badge.gpt { background: #0f3d2e; color: var(--gpt); }

    .sign-out-btn {
      background: none;
      color: var(--text-dim);
      font-size: 12px;
      font-weight: 500;
      padding: 6px 10px;
      width: auto;
      border: 1px solid var(--border);
      border-radius: 6px;
    }

    .team-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 4px;
      font-size: 12px;
      color: var(--text-dim);
    }

    .team-dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
    .team-dot.claude { background: var(--claude); }
    .team-dot.gpt { background: var(--gpt); }
    .team-dot.user { background: var(--user); }

    /* File upload */
    #file-input { display: none; }

    .attach-btn {
      width: 44px; height: 44px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text-dim);
      font-size: 18px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
      transition: all 0.15s;
    }

    .attach-btn:hover { border-color: var(--accent); color: var(--text); }
    .attach-btn.has-file { border-color: var(--claude); color: var(--claude); background: #1a1030; }

    .file-preview {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      margin: 0 16px 6px;
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 12px;
      color: var(--text-dim);
    }

    .file-preview.visible { display: flex; }
    .file-preview-name { color: var(--claude); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .file-remove {
      background: none;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      font-size: 14px;
      padding: 0;
      width: auto;
      flex-shrink: 0;
    }

    .message.has-file .message-bubble::before {
      content: '📎 ';
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-width: 88%;
    }

    .message.user { align-self: flex-end; align-items: flex-end; }
    .message.claude, .message.gpt { align-self: flex-start; }

    .message-author {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .message.user .message-author { color: var(--user); }
    .message.claude .message-author { color: var(--claude); }
    .message.gpt .message-author { color: var(--gpt); }

    .message-bubble {
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .message.user .message-bubble { background: var(--accent); border-bottom-right-radius: 4px; }
    .message.claude .message-bubble { background: var(--surface); border: 1px solid #3b1f7a; border-bottom-left-radius: 4px; }
    .message.gpt .message-bubble { background: var(--surface); border: 1px solid #0f3d2e; border-bottom-left-radius: 4px; }
    .message.error .message-bubble { background: #2d1515; border: 1px solid #7f1d1d; color: #fca5a5; }

    .message-time { font-size: 10px; color: var(--text-dim); }

    .typing-bubble {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 14px;
      border-bottom-left-radius: 4px;
      padding: 12px 16px;
      display: flex;
      gap: 4px;
      align-items: center;
    }

    .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--text-dim);
      animation: bounce 1.2s infinite;
    }

    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-4px); }
    }

    #input-area {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    #message-input {
      flex: 1;
      resize: none;
      min-height: 44px;
      max-height: 120px;
      overflow-y: auto;
      border-radius: 10px;
      padding: 11px 14px;
      font-family: inherit;
      font-size: 14px;
      line-height: 1.4;
    }

    #send-btn {
      width: 44px; height: 44px;
      border-radius: 10px;
      padding: 0;
      flex-shrink: 0;
      font-size: 18px;
    }

    .hints {
      padding: 6px 16px 0;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .hint-chip {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 100px;
      color: var(--text-dim);
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      transition: all 0.15s;
      width: auto;
    }

    .hint-chip:hover { border-color: var(--accent); color: var(--text); }

    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: var(--text-dim);
      text-align: center;
      padding: 32px;
    }

    .empty-state .emoji { font-size: 40px; }
    .empty-state h3 { font-size: 16px; color: var(--text); }
    .empty-state p { font-size: 13px; line-height: 1.5; }
  </style>
</head>
<body>

<!-- AUTH SCREEN -->
<div id="auth-screen">
  <div class="logo">Bridge <span>Studio</span></div>
  <div class="auth-card">
    <div>
      <h2 id="auth-title">Welcome back</h2>
      <p id="auth-subtitle">Sign in to your AI studio</p>
    </div>
    <input type="email" id="email" placeholder="Email" autocomplete="email" />
    <div class="input-wrap">
      <input type="password" id="password" placeholder="Password" autocomplete="current-password" />
      <button class="eye-btn" type="button" onclick="togglePassword()" id="eye-btn">👁</button>
    </div>
    <button id="auth-btn" onclick="handleAuth()">Sign in</button>
    <p class="error-msg" id="auth-error"></p>
    <p class="info-msg" id="auth-info"></p>
    <button class="auth-toggle" onclick="toggleAuthMode()">
      <span id="toggle-text">Don't have an account? Sign up</span>
    </button>
  </div>
</div>

<!-- CHAT SCREEN -->
<div id="chat-screen">
  <header>
    <div>
      <div class="project-name" id="project-name">Bridge Studio</div>
      <div class="team-row">
        <span class="team-dot claude"></span> Claude
        <span class="team-dot gpt"></span> GPT
        <span class="team-dot user"></span> Bridget
      </div>
    </div>
    <button class="sign-out-btn" onclick="signOut()">Sign out</button>
  </header>
  <input type="file" id="file-input" accept=".txt,.md,.js,.ts,.json,.html,.css,.py,.swift,.kt,.java,.xml,.csv,.sql" onchange="handleFileSelect(event)" />

  <div id="messages">
    <div class="empty-state" id="empty-state">
      <div class="emoji">🎵</div>
      <h3>Bridge Studio</h3>
      <p>Your AI team is here.<br/>Type a message or use the chips below.</p>
    </div>
  </div>

  <div class="hints">
    <button class="hint-chip" onclick="insertHint('@claude ')">@claude</button>
    <button class="hint-chip" onclick="insertHint('@gpt ')">@gpt</button>
    <button class="hint-chip" onclick="insertHint('@both ')">@both</button>
    <button class="hint-chip" onclick="insertHint('@debate ')">@debate</button>
  </div>

  <div class="file-preview" id="file-preview">
    <span>📎 <span class="file-preview-name" id="file-preview-name"></span></span>
    <button class="file-remove" onclick="removeFile()">✕</button>
  </div>

  <div id="input-area">
    <button class="attach-btn" id="attach-btn" onclick="document.getElementById('file-input').click()" title="Attach file">📎</button>
    <textarea
      id="message-input"
      placeholder="Message your AI team..."
      rows="1"
      onkeydown="handleKeyDown(event)"
      oninput="autoResize(this)"
    ></textarea>
    <button id="send-btn" onclick="sendMessage()">↑</button>
  </div>
</div>

<script>
  // ─── CONFIG ───────────────────────────────────────────────────────────────
  const SUPABASE_URL = 'https://tlyfhlvfetzpvltutjle.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_RmeXKru_kCcOnYIlmKHMXA_hUD6ClsK';

  // Warn if opened as a local file (content:// or file://) — fetch to HTTPS is blocked
  if (location.protocol === 'content:' || location.protocol === 'file:') {
    document.addEventListener('DOMContentLoaded', () => {
      const warn = document.createElement('div');
      warn.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#7f1d1d;color:#fca5a5;padding:12px 16px;font-size:13px;z-index:9999;text-align:center;line-height:1.5';
      warn.innerHTML = '⚠️ Open Bridge Studio from its hosted URL, not a local file — fetch is blocked here.<br>Visit: <b>https://tlyfhlvfetzpvltutjle.supabase.co/storage/v1/object/public/app/index.html</b>';
      document.body.prepend(warn);
    });
  }

  const { createClient } = supabase;
  const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

  let currentUser = null;
  let currentProject = null;
  let isSignUp = false;
  let isSending = false;
  let pendingFile = null; // { name, content }

  // ─── EDGE FUNCTION URL ────────────────────────────────────────────────────
  const EDGE_FN_URL = `${SUPABASE_URL}/functions/v1/orchestrate`;

  // ─── AUTH ─────────────────────────────────────────────────────────────────
  async function init() {
    const { data: { session } } = await sb.auth.getSession();
    if (session) {
      currentUser = session.user;
      await loadChat();
    }
  }

  function showScreen(id) {
    ['auth-screen', 'chat-screen'].forEach(s => {
      const el = document.getElementById(s);
      if (!el) return;
      el.style.display = s === id ? 'flex' : 'none';
      if (s === id && s === 'chat-screen') el.style.flexDirection = 'column';
    });
  }

  function togglePassword() {
    const input = document.getElementById('password');
    const btn = document.getElementById('eye-btn');
    if (input.type === 'password') {
      input.type = 'text';
      btn.textContent = '🙈';
    } else {
      input.type = 'password';
      btn.textContent = '👁';
    }
  }

  function toggleAuthMode() {
    isSignUp = !isSignUp;
    document.getElementById('auth-title').textContent = isSignUp ? 'Create account' : 'Welcome back';
    document.getElementById('auth-subtitle').textContent = isSignUp ? 'Join your AI studio' : 'Sign in to your AI studio';
    document.getElementById('auth-btn').textContent = isSignUp ? 'Sign up' : 'Sign in';
    document.getElementById('toggle-text').textContent = isSignUp
      ? 'Already have an account? Sign in'
      : "Don't have an account? Sign up";
    document.getElementById('auth-error').textContent = '';
    document.getElementById('auth-info').textContent = '';
  }

  async function handleAuth() {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const btn = document.getElementById('auth-btn');
    const errEl = document.getElementById('auth-error');
    const infoEl = document.getElementById('auth-info');

    if (!email || !password) { errEl.textContent = 'Please fill in all fields.'; return; }

    btn.disabled = true;
    btn.textContent = isSignUp ? 'Creating account...' : 'Signing in...';
    errEl.textContent = '';
    infoEl.textContent = '';

    const { data, error } = isSignUp
      ? await sb.auth.signUp({ email, password })
      : await sb.auth.signInWithPassword({ email, password });

    if (error) {
      errEl.textContent = error.message;
      btn.disabled = false;
      btn.textContent = isSignUp ? 'Sign up' : 'Sign in';
      return;
    }

    if (isSignUp && !data.session) {
      infoEl.textContent = 'Check your email to confirm your account, then sign in.';
      btn.disabled = false;
      btn.textContent = 'Sign up';
      return;
    }

    currentUser = data.user || data.session?.user;
    await loadChat();
  }

  async function signOut() {
    await sb.auth.signOut();
    currentUser = null;
    currentProject = null;
    document.getElementById('messages').innerHTML = '';
    showScreen('auth-screen');
  }

  // ─── CHAT SETUP ───────────────────────────────────────────────────────────
  async function loadChat() {
    showScreen('chat-screen');

    let { data: projects, error } = await sb.from('projects').select('*').limit(1);

    if (!projects || projects.length === 0) {
      const { data: newProject, error: projErr } = await sb
        .from('projects')
        .insert({ owner_id: currentUser.id, name: 'Sound Check' })
        .select()
        .single();

      if (projErr) {
        console.error('Project creation error:', projErr);
        return;
      }

      currentProject = newProject;

      await sb.from('memories').insert([
        {
          project_id: currentProject.id,
          owner: 'shared',
          content: 'Project: Sound Check — a multiplayer music industry life simulation game. Solo developer: Bridget. Mobile-first development using Acode. Bridge Studio is our shared AI workspace — Claude and GPT collaborate freely, no fixed roles.',
        },
        {
          project_id: currentProject.id,
          owner: 'claude',
          content: "I am Claude, collaborating with Bridget on her projects. I contribute wherever I'm most useful — design, code, critique, story, mechanics. I'll push back on GPT when I have a better approach.",
        },
        {
          project_id: currentProject.id,
          owner: 'gpt',
          content: "I am GPT, collaborating with Bridget on her projects. I contribute wherever I'm most useful. I'll push back on Claude when I have a better approach.",
        },
      ]);
    } else {
      currentProject = projects[0];
    }

    document.getElementById('project-name').textContent = currentProject.name;
    await loadMessages();
    subscribeToMessages();
  }

  // ─── MESSAGES ─────────────────────────────────────────────────────────────
  async function loadMessages() {
    const { data: messages } = await sb
      .from('messages')
      .select('*')
      .eq('project_id', currentProject.id)
      .order('created_at', { ascending: true });

    if (messages && messages.length > 0) {
      document.getElementById('empty-state')?.remove();
      messages.forEach(renderMessage);
    }
    scrollToBottom();
  }

  function subscribeToMessages() {
    sb.channel('room-' + currentProject.id)
      .on('postgres_changes', {
        event: 'INSERT',
        schema: 'public',
        table: 'messages',
        filter: `project_id=eq.${currentProject.id}`,
      }, (payload) => {
        if (payload.new.author !== 'user') {
          document.getElementById('empty-state')?.remove();
          renderMessage(payload.new);
          scrollToBottom();
        }
      })
      .subscribe();
  }

  function renderMessage(msg) {
    const container = document.getElementById('messages');
    const el = document.createElement('div');
    el.classList.add('message', msg.author);
    el.dataset.id = msg.id;

    const authorName = msg.author === 'user' ? 'You' : msg.author === 'claude' ? 'Claude' : msg.author === 'gpt' ? 'GPT' : msg.author;
    const time = new Date(msg.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

    el.innerHTML = `
      <div class="message-author">${authorName}</div>
      <div class="message-bubble">${escapeHtml(msg.content)}</div>
      <div class="message-time">${time}</div>
    `;
    container.appendChild(el);
  }

  function renderError(who, text) {
    const container = document.getElementById('messages');
    const el = document.createElement('div');
    el.classList.add('message', 'error');
    el.innerHTML = `
      <div class="message-author">${who}</div>
      <div class="message-bubble">⚠️ ${escapeHtml(text)}</div>
    `;
    container.appendChild(el);
    scrollToBottom();
  }

  function showTypingFor(targets) {
    targets.forEach(who => {
      const existing = document.getElementById('typing-' + who);
      if (existing) return;
      const container = document.getElementById('messages');
      const el = document.createElement('div');
      el.classList.add('message', who);
      el.id = 'typing-' + who;
      const name = who === 'claude' ? 'Claude' : 'GPT';
      el.innerHTML = `
        <div class="message-author">${name}</div>
        <div class="typing-bubble">
          <div class="dot"></div><div class="dot"></div><div class="dot"></div>
        </div>
      `;
      container.appendChild(el);
    });
    scrollToBottom();
  }

  function removeTyping(who) {
    document.getElementById('typing-' + who)?.remove();
  }

  // ─── SENDING ──────────────────────────────────────────────────────────────
  async function sendMessage() {
    if (isSending) return;
    const input = document.getElementById('message-input');
    const content = input.value.trim();
    if (!content || !currentProject) return;

    isSending = true;
    const btn = document.getElementById('send-btn');
    btn.disabled = true;
    input.value = '';
    input.style.height = 'auto';

    // Capture and clear file
    const fileToSend = pendingFile;
    if (fileToSend) removeFile();

    // Display label if file attached
    const displayContent = fileToSend ? `${content}\n\n📎 ${fileToSend.name}` : content;

    // Save + render user message (without file content — just show name)
    const { data: userMsg } = await sb.from('messages').insert({
      project_id: currentProject.id,
      author: 'user',
      content: displayContent,
    }).select().single();

    document.getElementById('empty-state')?.remove();
    if (userMsg) renderMessage(userMsg);
    scrollToBottom();

    // Determine who responds for typing indicators
    const lower = content.toLowerCase().trim();
    const targets = lower.startsWith('@claude') ? ['claude']
      : lower.startsWith('@gpt') ? ['gpt']
      : ['claude', 'gpt'];
    showTypingFor(targets);

    try {
      const { data: { session } } = await sb.auth.getSession();
      const res = await fetch(EDGE_FN_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${session.access_token}`,
        },
        body: JSON.stringify({
          project_id: currentProject.id,
          content,
          file_content: fileToSend ? fileToSend.content : null,
        }),
      });

      removeTypingAll();

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        renderError('System', err.error || `Server error ${res.status}`);
      }
      // AI messages come in via realtime subscription
    } catch (e) {
      removeTypingAll();
      renderError('System', e.message);
    } finally {
      isSending = false;
      btn.disabled = false;
    }
  }

  function removeTypingAll() {
    removeTyping('claude');
    removeTyping('gpt');
  }

  // ─── FILE HANDLING ────────────────────────────────────────────────────────
  function handleFileSelect(event) {
    const file = event.target.files[0];
    if (!file) return;

    // Max 500KB for text files
    if (file.size > 500 * 1024) {
      alert('File too large. Please keep files under 500KB.');
      return;
    }

    const reader = new FileReader();
    reader.onload = (e) => {
      pendingFile = { name: file.name, content: e.target.result };
      document.getElementById('file-preview-name').textContent = file.name;
      document.getElementById('file-preview').classList.add('visible');
      document.getElementById('attach-btn').classList.add('has-file');
      document.getElementById('attach-btn').textContent = '✓';
    };
    reader.readAsText(file);

    // Reset input so same file can be re-selected
    event.target.value = '';
  }

  function removeFile() {
    pendingFile = null;
    document.getElementById('file-preview').classList.remove('visible');
    document.getElementById('attach-btn').classList.remove('has-file');
    document.getElementById('attach-btn').textContent = '📎';
  }

  function handleKeyDown(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  }

  function insertHint(text) {
    const input = document.getElementById('message-input');
    input.value = text;
    input.focus();
  }

  // ─── UTILS ────────────────────────────────────────────────────────────────
  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 120) + 'px';
  }

  function scrollToBottom() {
    const c = document.getElementById('messages');
    c.scrollTop = c.scrollHeight;
  }

  function escapeHtml(text) {
    const d = document.createElement('div');
    d.appendChild(document.createTextNode(text));
    return d.innerHTML;
  }

  init();
</script>
</body>
</html>
